name: Fixium Code Review Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Only allow one review per PR at a time
concurrency:
  group: fixium-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fixium-review:
    # Run review from PR issue comments and implement from PR review-thread replies
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == 'Fixium:review'
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.body == 'Fixium:implement'
      )
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      packages: read
    
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let pr;
            if (context.eventName === 'pull_request_review_comment') {
              // For review comments, get PR from the comment
              const prNumber = context.payload.pull_request.number;
              const result = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = result.data;
            } else {
              // For issue comments
              pr = context.payload.issue || context.payload.pull_request;
            }
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('number', pr.number);
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the actual PR branch (not detached HEAD) to allow pushing commits
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          # Use a token with write permissions
          token: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Run Fixium Code Review (Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e GITHUB_TOKEN="${{ secrets.MY_GITHUB_TOKEN }}" \
            -e BOBSHELL_API_KEY="${{ secrets.BOBSHELL_API_KEY }}" \
            -e FIXIUM_AUTHORIZED_USERS="${{ secrets.FIXIUM_AUTHORIZED_USERS }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_OWNER="${{ github.repository_owner }}" \
            -e GITHUB_REPO="${{ github.event.repository.name }}" \
            -e PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}" \
            -e COMMENT_ID="${{ github.event.comment.id }}" \
            -e REPLY_TO_COMMENT_ID="${{ github.event.comment.in_reply_to_id }}" \
            -e COMMENT_BODY="${{ github.event.comment.body }}" \
            -e COMMENT_USER="${{ github.event.comment.user.login }}" \
            -e GITHUB_WORKSPACE="/workspace" \
            ghcr.io/maheshz/fixium:latest
      
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixium-review-${{ github.event.pull_request.number || github.event.issue.number }}
          path: |
            review_pr${{ github.event.pull_request.number || github.event.issue.number }}.json
          retention-days: 30
          if-no-files-found: ignore

